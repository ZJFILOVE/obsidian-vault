name: validate-daily-recommendations

on:
  push:
    paths:
      - 'Resources/YouTube/Daily/**'
      - 'Resources/Reddit/Daily/**'
      - '50-courses/English/Daily/**'
      - 'Music/Daily/**'
      - '.recommendation/**'
      - 'scripts/validate_daily_recommendations.py'
      - '.github/workflows/validate-daily-recommendations.yml'
  pull_request:
    paths:
      - 'Resources/YouTube/Daily/**'
      - 'Resources/Reddit/Daily/**'
      - '50-courses/English/Daily/**'
      - 'Music/Daily/**'
      - '.recommendation/**'
      - 'scripts/validate_daily_recommendations.py'
      - '.github/workflows/validate-daily-recommendations.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_daily_recommendations.py
