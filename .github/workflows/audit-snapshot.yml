name: Audit snapshot (read-only)
on:
  push:
    branches: ['audit/2026-10-14-system-review']
    paths: ['.github/workflows/audit-snapshot.yml']
permissions:
  contents: read
concurrency:
  group: audit-snapshot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: 22bcbe4dceaa8983c9cb89cb0d4a31a4bc4aa8a2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect pinned files and history without executing project code
        shell: bash
        run: |
          python - '22bcbe4dceaa8983c9cb89cb0d4a31a4bc4aa8a2' audit-output <<'PY'
          from __future__ import annotations
          import ast, hashlib, json, re, subprocess, sys, zipfile
          from pathlib import Path, PurePosixPath
          TEXT={'.py','.js','.json','.jsonl','.yaml','.yml','.md','.txt','.toml','.ini','.cfg','.sh','.bash','.ps1','.m','.tex','.bib','.html','.htm','.css','.less','.xml','.r','.jl','.csv','.ts','.tsx','.jsx','.ipynb'}
          NAMES={'Makefile','Gemfile','Gemfile.lock','Rakefile','Dockerfile','CNAME','.gitignore','.gitattributes','requirements.txt','.bootstrap-complete'}
          SECRET_PATH=re.compile(r'(^|/)(\.env(?:\..*)?|\.git-credentials|id_rsa|id_ed25519|credentials(?:\.[^/]*)?|secrets(?:\.[^/]*)?)$|\.(?:pem|key|p12|pfx)$',re.I)
          SECRET=re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----|\bgh[pousr]_[A-Za-z0-9]{30,}\b|\bgithub_pat_[A-Za-z0-9_]{30,}\b|\bAKIA[A-Z0-9]{16}\b|\bxox[baprs]-[A-Za-z0-9-]{20,}\b|\bsk-(?:proj-)?[A-Za-z0-9_-]{40,}\b')
          MAX_TEXT=20*1024*1024
          def git(*args):
              return subprocess.check_output(['git',*args],stderr=subprocess.PIPE)
          def strict_object(pairs):
              result={}
              for key,value in pairs:
                  if key in result: raise ValueError('duplicate JSON key')
                  result[key]=value
              return result
          rev=sys.argv[1]
          if not re.fullmatch(r'[0-9a-f]{40}',rev): raise SystemExit('Expected pinned commit SHA')
          out=Path(sys.argv[2]);out.mkdir(parents=True,exist_ok=True)
          inventory,excluded,checks,security=[],[],[],[]
          with zipfile.ZipFile(out/'snapshot.zip','w',zipfile.ZIP_DEFLATED) as bundle:
              for raw in git('ls-tree','-r','-z','-l',rev).split(b'\0'):
                  if not raw: continue
                  meta,name=raw.split(b'\t',1)
                  mode,kind,sha,size=meta.decode().split()
                  path=name.decode('utf-8',errors='surrogateescape');size=None if size=='-' else int(size)
                  inventory.append({'path':path,'mode':mode,'type':kind,'sha':sha,'size':size})
                  pp=PurePosixPath(path)
                  if mode not in {'100644','100755'} or kind!='blob':
                      excluded.append({'path':path,'reason':'symlink-or-non-regular-object'});continue
                  if SECRET_PATH.search(path):
                      excluded.append({'path':path,'reason':'credential-filename-not-read'});continue
                  if pp.suffix.lower() not in TEXT and pp.name not in NAMES:
                      excluded.append({'path':path,'reason':'binary-or-unselected-format'});continue
                  if size is not None and size>MAX_TEXT:
                      excluded.append({'path':path,'reason':'over-20-MiB-text-limit'});continue
                  data=git('cat-file','blob',sha)
                  try: text=data.decode('utf-8-sig')
                  except UnicodeDecodeError:
                      excluded.append({'path':path,'reason':'non-UTF-8'});continue
                  if SECRET.search(text):
                      security.append({'path':path,'line_numbers':[i for i,l in enumerate(text.splitlines(),1) if SECRET.search(l)],'reason':'potential-secret-redacted-file'});continue
                  record={'path':path,'sha':sha,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
                  suffix=pp.suffix.lower()
                  try:
                      if suffix in {'.json','.ipynb'}:
                          json.loads(text,object_pairs_hook=strict_object,parse_constant=lambda x: (_ for _ in ()).throw(ValueError('non-finite JSON number')))
                          record['json']='passed'
                      elif suffix=='.jsonl':
                          for line in text.splitlines():
                              if line.strip(): json.loads(line,object_pairs_hook=strict_object)
                          record['jsonl']='passed'
                      elif suffix=='.py':
                          ast.parse(text,filename=path);record['python_syntax']='passed'
                  except (ValueError,SyntaxError) as exc:
                      record['error_type']=type(exc).__name__;record['line']=getattr(exc,'lineno',None)
                  if pp.is_absolute() or '..' in pp.parts: raise SystemExit('Unsafe Git path refused')
                  bundle.writestr('current/'+path,data);checks.append(record)
              paths=['recommendations','state','Music/Daily','.recommendation','Resources/YouTube/Daily','Resources/Reddit/Daily','50-courses/English']
              history=[]
              for obj in git('rev-list','--objects','--all','--',*paths).decode('utf-8',errors='replace').splitlines():
                  parts=obj.split(' ',1)
                  if len(parts)!=2: continue
                  sha,path=parts;pp=PurePosixPath(path)
                  if pp.suffix.lower() not in {'.json','.jsonl','.md'} or SECRET_PATH.search(path): continue
                  if git('cat-file','-t',sha).strip()!=b'blob': continue
                  size=int(git('cat-file','-s',sha))
                  if size>MAX_TEXT:
                      excluded.append({'path':path,'sha':sha,'reason':'historical-over-20-MiB'});continue
                  data=git('cat-file','blob',sha)
                  try: text=data.decode('utf-8-sig')
                  except UnicodeDecodeError: continue
                  if SECRET.search(text):
                      security.append({'path':path,'sha':sha,'reason':'historical-potential-secret-no-content'});continue
                  history.append({'path':path,'sha':sha,'bytes':size});bundle.writestr('history/blobs/'+sha,data)
              log=git('log','--all','--date=iso-strict','--format=%H%x09%P%x09%cI%x09%s','--name-status').decode('utf-8',errors='replace')
              bundle.writestr('commits.txt',SECRET.sub('[REDACTED]',log))
              bundle.writestr('refs.txt',git('for-each-ref','--format=%(refname) %(objectname)'))
              summary={'snapshot_commit':rev,'tree_sha':git('rev-parse',rev+'^{tree}').decode().strip(),'commit_count':int(git('rev-list','--count',rev)),'tracked_objects':len(inventory),'exported_text_files':len(checks),'history_blobs':len(history),'excluded_count':len(excluded),'potential_secret_files':len(security),'parse_errors':sum('error_type' in c for c in checks),'coverage':'Pinned default-branch snapshot; recommendation/history versions reachable from all fetched refs; non-text and credential-like paths explicitly excluded.'}
              for name,data in [('inventory',inventory),('checks',checks),('excluded',excluded),('security_findings',security),('history/index',history),('summary',summary)]:
                  bundle.writestr(name+'.json',json.dumps(data,ensure_ascii=True,indent=2)+'\n')
              (out/'summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: audit-snapshot
          path: audit-output/
          if-no-files-found: error
          retention-days: 7
